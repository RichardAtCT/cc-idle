name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Takes the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - name: Check the mod bundle is up to date
        run: git diff --exit-code -- plugins/cc-idle/hooks/register.js

      - run: pnpm -r test

      - name: Validate hook scripts (if present)
        run: |
          if ls hooks/*.sh >/dev/null 2>&1; then
            for f in hooks/*.sh; do
              sh -n "$f"
            done
          fi
